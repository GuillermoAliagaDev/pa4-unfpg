spring.application.name=unfpg-api-gateway
server.port=8000

# ==========================================
# 1. MICROSERVICIO PERSONA
# ==========================================
spring.cloud.gateway.server.webflux.routes[0].id=unfpg-persona-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/alumnos/**,/api/docentes/**,/api/empleados/**

# ==========================================
# 2. MICROSERVICIO BIBLIOTECA
# ==========================================
spring.cloud.gateway.server.webflux.routes[1].id=unfpg-biblioteca-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/libros/**,/api/ejemplares/**,/api/prestamos/**

# ==========================================
# 3. MICROSERVICIO ACADEMICO
# ==========================================
spring.cloud.gateway.server.webflux.routes[2].id=unfpg-academico-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/matriculas/**,/api/cursos/**,/api/asistencias/**,/api/aula/**,/api/calificaciones/**,/api/detallematricula/**,/api/facultad/**,/api/horarios/**,/api/periodoacademico/**,/api/planestudio/**,/api/programa/**,/api/secciones/**,/api/traslado/**

# ==========================================
# 4. MICROSERVICIO FINANCIERO
# ==========================================
spring.cloud.gateway.server.webflux.routes[3].id=unfpg-financiero-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/ordenes-pago/**,/api/pagos/**

# ==========================================
# 5. MICROSERVICIO AULA VIRTUAL
# ==========================================
spring.cloud.gateway.server.webflux.routes[4].id=unfpg-aula-virtual-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/cursos-lms/**,/api/evaluaciones/**,/api/matriculas-lms/**

# ==========================================
# 6. MICROSERVICIO SEGURIDAD
# ==========================================
spring.cloud.gateway.server.webflux.routes[5].id=unfpg-seguridad-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/roles/**,/api/usuarios/**

# ==========================================
# 7. MICROSERVICIO CATALOGO
# ==========================================
spring.cloud.gateway.server.webflux.routes[6].id=unfpg-catalogo-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/areaempleo/**,/api/bloque/**,/api/cargo/**,/api/categorialibro/**,/api/conceptopago/**,/api/diasemana/**,/api/distrito/**,/api/editorial/**,/api/estadoaula/**,/api/estadocivil/**,/api/estadomatricula/**,/api/estados-pago/**,/api/estadoprestamolibro/**,/api/gradoinstruccion/**,/api/metodopago/**,/api/rollms/**,/api/sexo/**,/api/tipoaula/**,/api/tipocalificacion/**,/api/tipodocumento/**,/api/tipomatricula/**,/api/ubicacion/**