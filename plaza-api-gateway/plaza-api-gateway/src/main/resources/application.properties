spring.application.name=plaza-api-gateway
server.port=8090

# ==========================================
# 1. MICROSERVICIO CLIENTE
# ==========================================
spring.cloud.gateway.server.webflux.routes[0].id=plaza-cliente-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8091
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clientes/**,/api/tipodocumento/**

# ==========================================
# 2. MICROSERVICIO PRODUCTO
# ==========================================
spring.cloud.gateway.server.webflux.routes[1].id=plaza-producto-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8092
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/categorias/**,/api/productos/**

# ==========================================
# 3. MICROSERVICIO VENTAS
# ==========================================
spring.cloud.gateway.server.webflux.routes[2].id=plaza-ventas-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8093
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/detalles-venta/**,/api/pedidos/**,/api/ventas/**

# ==========================================
# 4. MICROSERVICIO COMPRAS
# ==========================================
spring.cloud.gateway.server.webflux.routes[3].id=plaza-compras-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8094
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/ordenes-compra/**,/api/proveedores/**

# ==========================================
# 5. MICROSERVICIO LOGISTICA
# ==========================================
spring.cloud.gateway.server.webflux.routes[4].id=plaza-logistica-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8095
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/almacenes/**,/api/despachos/**,/api/inventarios/**,/api/sucursales/**

# ==========================================
# 6. MICROSERVICIO PAGOS
# ==========================================
spring.cloud.gateway.server.webflux.routes[5].id=plaza-pagos-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8096
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/metodospago/**,/api/pagos/**

# ==========================================
# 7. MICROSERVICIO PERSONAL
# ==========================================
spring.cloud.gateway.server.webflux.routes[6].id=plaza-personal-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8097
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/auditorias/**,/api/empleados/**,/api/usuarios/**